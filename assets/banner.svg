<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#10192b" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE" />
      <stop offset="50%" stop-color="#229ED9" />
      <stop offset="100%" stop-color="#8A5BFF" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8A5BFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="120" r="180" fill="#2AABEE" filter="url(#blurGlow)" opacity="0.35" />
  <circle cx="1020" cy="280" r="220" fill="#8A5BFF" filter="url(#blurGlow)" opacity="0.25" />

  <!-- Subtle Circuit / Network Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Central Card Container -->
  <rect x="80" y="40" width="1040" height="320" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Telegram Plane Icon Graphic with Aura -->
  <g transform="translate(140, 110)">
    <circle cx="90" cy="90" r="80" fill="url(#accentGrad)" opacity="0.2" filter="url(#blurGlow)" />
    <circle cx="90" cy="90" r="64" fill="url(#accentGrad)" filter="url(#shadow)" />
    <!-- Telegram Paper Plane -->
    <path d="M54 90 L126 58 C129 56.5 132 59 131 62 L118 123 C117.5 125.5 114 126.5 112 125 L96 112 L87 121 C85.5 122.5 83 121.5 83 119.5 L84 105 L116 75 C117 74 116 73 115 73.5 L73 100 L55 94.5 C52.5 93.8 52.5 90.7 54 90 Z" fill="#ffffff" />
  </g>

  <!-- Title & Branding -->
  <text x="360" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Telegram AI Content Pipeline
  </text>

  <!-- Subtitle -->
  <text x="360" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Autonomous Curation, Multi-Model AI Synthesis &amp; Telegram Channel Publishing
  </text>

  <!-- Feature Pills -->
  <g transform="translate(360, 230)">
    <!-- Pill 1: Telethon Relay -->
    <rect x="0" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Telethon Relay</text>

    <!-- Pill 2: SQLite WAL -->
    <rect x="145" y="0" width="125" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8">🗄️ SQLite WAL</text>

    <!-- Pill 3: n8n Engine -->
    <rect x="280" y="0" width="120" height="34" rx="17" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1" />
    <text x="296" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f43f5e">⚙️ n8n Engine</text>

    <!-- Pill 4: Gemini + DeepSeek -->
    <rect x="410" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
    <text x="424" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🧠 Multi-Model AI</text>

    <!-- Pill 5: Human in the Loop -->
    <rect x="585" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="600" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10b981">✨ Human-in-Loop</text>
  </g>

  <!-- Status Indicator: Production Ready -->
  <g transform="translate(140, 310)">
    <circle cx="8" cy="8" r="5" fill="#10b981" />
    <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Production Ready v1.0.0 • Open Source (MIT)</text>
  </g>
</svg>
