# ==============================================================================
# Telegram AI Content Pipeline - Docker Compose
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Telegram Relay Userbot (Telethon + SQLite Queue)
  # ----------------------------------------------------------------------------
  relay-userbot:
    build:
      context: ./account-controler
      dockerfile: Dockerfile
    container_name: telegram_relay_userbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/relay_queue.db
      - PORT=8080
      - LOG_TO_FILE=0
    volumes:
      - userbot_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Session Generator Web Tool (Flask + Waitress)
  # ----------------------------------------------------------------------------
  session-generator:
    build:
      context: ./session-generator-service
      dockerfile: Dockerfile
    container_name: telegram_session_generator
    restart: unless-stopped
    ports:
      - "${SESSION_GEN_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. n8n Workflow Automation Engine (Multi-Model AI Pipeline)
  # ----------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: telegram_n8n_pipeline
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - TARGET_CHANNEL_ID=${TARGET_CHANNEL_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-bot/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  userbot_data:
    driver: local
  n8n_data:
    driver: local
