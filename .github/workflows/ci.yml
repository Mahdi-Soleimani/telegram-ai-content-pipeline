name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f account-controler/requirements.txt ]; then pip install -r account-controler/requirements.txt; fi
          if [ -f session-generator-service/requirements.txt ]; then pip install -r session-generator-service/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.git,__pycache__,venv

      - name: Validate Workflow JSON files
        run: |
          python -c "
          import json, glob
          for path in glob.glob('n8n-bot/workflows/*.json'):
              with open(path) as f:
                  json.load(f)
              print(f'Valid JSON: {path}')
          "

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-test:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Userbot Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./account-controler
          file: ./account-controler/Dockerfile
          push: false
          tags: userbot:test

      - name: Build Session Generator Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./session-generator-service
          file: ./session-generator-service/Dockerfile
          push: false
          tags: session-generator:test
